<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HYPER UNIVERSITY | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0c1322;
            --surface: #141b2b;
            --surface2: #191f2f;
            --surface3: #232a3a;
            --surface4: #2e3545;
            --primary: #d0bcff;
            --primary2: #a078ff;
            --primary3: #6d3bd7;
            --secondary: #dfb7ff;
            --text: #dce2f7;
            --muted: #9b93a8;
            --outline: #494454;
            --error: #ffb4ab;
            --success: #6fcf97;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(12, 19, 34, .85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(208, 188, 255, .07);
            padding: .9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: .95rem;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-member {
            font-size: .8rem;
            color: var(--muted);
        }

        .nav-member span {
            color: var(--primary);
            font-weight: 600;
        }

        .btn-sm {
            padding: .45rem .9rem;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            transition: all .2s;
        }

        .btn-logout {
            background: var(--surface3);
            color: var(--muted);
        }

        .btn-logout:hover {
            color: var(--error);
            background: rgba(255, 180, 171, .1);
        }

        /* LAYOUT */
        .page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .grid-main {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 1.5rem;
            align-items: start;
        }

        @media(max-width:900px) {
            .grid-main {
                grid-template-columns: 1fr;
            }
        }

        /* SECTION TITLE */
        .sec-label {
            font-size: .65rem;
            font-weight: 700;
            letter-spacing: .25em;
            text-transform: uppercase;
            color: var(--primary);
            margin-bottom: .5rem;
        }

        .sec-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }

        /* TODAY CARD */
        .today-card {
            background: var(--surface);
            border: 1px solid rgba(208, 188, 255, .08);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .today-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary3), var(--primary2), var(--primary));
        }

        .today-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: .5rem;
        }

        .today-date {
            font-size: .78rem;
            color: var(--muted);
        }

        .today-status {
            display: flex;
            align-items: center;
            gap: .4rem;
            font-size: .72rem;
            font-weight: 600;
            padding: .3rem .7rem;
            border-radius: 20px;
        }

        .status-pending {
            background: rgba(255, 180, 171, .1);
            color: var(--error);
            border: 1px solid rgba(255, 180, 171, .2);
        }

        .status-done {
            background: rgba(111, 207, 151, .1);
            color: var(--success);
            border: 1px solid rgba(111, 207, 151, .2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .goals-area textarea {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--outline);
            border-radius: 10px;
            padding: .85rem 1rem;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: .85rem;
            resize: vertical;
            min-height: 100px;
            outline: none;
            transition: border .2s;
        }

        .goals-area textarea:focus {
            border-color: var(--primary2);
        }

        .goals-area textarea:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .goals-label {
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: .5rem;
        }

        .submit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: .85rem;
            flex-wrap: wrap;
            gap: .5rem;
        }

        .btn-submit {
            padding: .7rem 1.5rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--primary), var(--primary2));
            color: #23005c;
            transition: all .2s;
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(160, 120, 255, .3);
        }

        .btn-submit:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }

        .submit-hint {
            font-size: .72rem;
            color: var(--muted);
        }

        /* STATS ROW */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: .85rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: rgba(20, 27, 43, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(208, 188, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            border-color: rgba(208, 188, 255, 0.25);
        }

        .stat-val {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
        }

        .stat-lbl {
            font-size: .65rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: .2rem;
        }

        /* WEEKLY GRID */
        .week-card {
            background: var(--surface);
            border: 1px solid rgba(208, 188, 255, .08);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .week-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: .4rem;
            margin-top: .85rem;
        }

        .day-cell {
            aspect-ratio: 1;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: .6rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: transform .2s;
        }

        .day-cell .day-name {
            font-size: .55rem;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .day-empty {
            background: var(--surface2);
            border: 1px solid var(--outline);
        }

        .day-done {
            background: rgba(208, 188, 255, .15);
            border: 1px solid rgba(208, 188, 255, .3);
            color: var(--primary);
        }

        .day-missed {
            background: rgba(255, 180, 171, .07);
            border: 1px solid rgba(255, 180, 171, .15);
            color: rgba(255, 180, 171, .5);
        }

        .day-today {
            border: 2px solid var(--primary2) !important;
        }

        /* LEADERBOARD */
        .lb-card {
            background: rgba(20, 27, 43, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(208, 188, 255, 0.1);
            border-radius: 20px;
            padding: 1.75rem;
            position: sticky;
            top: 80px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .lb-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .lb-refresh {
            background: var(--surface3);
            border: 1px solid var(--outline);
            border-radius: 8px;
            padding: .4rem .7rem;
            color: var(--muted);
            font-size: .7rem;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: .35rem;
            transition: all .2s;
        }

        .lb-refresh:hover {
            color: var(--primary);
            border-color: rgba(208, 188, 255, .3);
        }

        .lb-refresh svg {
            width: 12px;
            height: 12px;
            transition: transform .4s;
        }

        .lb-refresh.spinning svg {
            animation: spin .6s linear;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .lb-list {
            display: flex;
            flex-direction: column;
            gap: .5rem;
            max-height: 520px;
            overflow-y: auto;
            padding-right: .25rem;
        }

        .lb-list::-webkit-scrollbar {
            width: 3px;
        }

        .lb-list::-webkit-scrollbar-thumb {
            background: var(--outline);
            border-radius: 2px;
        }

        .lb-item {
            display: flex;
            align-items: center;
            gap: .75rem;
            padding: .75rem .85rem;
            border-radius: 10px;
            border: 1px solid transparent;
            transition: all .25s;
            cursor: default;
        }

        .lb-item:hover {
            background: var(--surface2);
            border-color: rgba(208, 188, 255, .08);
        }

        .lb-item.is-me {
            background: rgba(208, 188, 255, .07);
            border-color: rgba(208, 188, 255, .2);
        }

        .lb-rank {
            font-family: 'Space Grotesk', sans-serif;
            font-size: .75rem;
            font-weight: 700;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
        }

        .rank-1 {
            color: var(--gold);
        }

        .rank-2 {
            color: var(--silver);
        }

        .rank-3 {
            color: var(--bronze);
        }

        .rank-other {
            color: var(--muted);
        }

        .lb-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: .85rem;
            flex-shrink: 0;
            border: 2px solid transparent;
        }

        .lb-info {
            flex: 1;
            min-width: 0;
        }

        .lb-name {
            font-size: .85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lb-streak {
            font-size: .68rem;
            color: var(--muted);
        }

        .lb-score {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            flex-shrink: 0;
        }

        .lb-empty {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            font-size: .82rem;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--surface3);
            border: 1px solid rgba(208, 188, 255, .15);
            border-radius: 12px;
            padding: .85rem 1.25rem;
            font-size: .82rem;
            z-index: 9999;
            transform: translateY(80px);
            opacity: 0;
            transition: all .35s cubic-bezier(.16, 1, .3, 1);
            max-width: 320px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: rgba(111, 207, 151, .3);
            color: var(--success);
        }

        .toast.error {
            border-color: rgba(255, 180, 171, .3);
            color: var(--error);
        }

        /* LOADING SKELETON */
        .skeleton {
            background: linear-gradient(90deg, var(--surface2) 25%, var(--surface3) 50%, var(--surface2) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.4s infinite;
            border-radius: 6px;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .skel-row {
            height: 48px;
            margin-bottom: .5rem;
        }

        .glow-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(208, 188, 255, .2), transparent);
            margin-bottom: 1.5rem;
        }

        /* MOBILE OPTIMIZATIONS */
        @media (max-width: 768px) {
            .grid-main {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .stats-row {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }
            .page {
                padding: 1rem;
            }
            nav {
                flex-wrap: wrap;
                gap: 0.75rem;
                padding: 1rem;
            }
            .nav-logo {
                font-size: 0.85rem;
            }
            .nav-right {
                width: 100%;
                justify-content: space-between;
                padding-top: 0.5rem;
                border-top: 1px solid rgba(208,188,255,0.1);
            }
            .btn-sm {
                padding: 0.5rem 0.8rem;
                font-size: 0.7rem;
            }
            .lb-card {
                padding: 1.25rem 1rem;
            }
            .stat-card {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

    <div style="position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;">
        <div style="position:absolute;top:-20%;left:-10%;width:500px;height:500px;background:var(--primary2);filter:blur(150px);opacity:0.07;border-radius:50%;"></div>
        <div style="position:absolute;bottom:-20%;right:-10%;width:500px;height:500px;background:#691ea6;filter:blur(150px);opacity:0.07;border-radius:50%;"></div>
    </div>
    
    <nav style="background: rgba(12, 19, 34, 0.6); backdrop-filter: blur(25px); border-bottom: 1px solid rgba(208, 188, 255, 0.1);">
        <div class="nav-logo">Hyper University</div>
        <div class="nav-right">
            <div class="nav-member">Logged in as <span id="navName">—</span></div>
            <button class="btn-sm btn-logout" style="border:1px solid rgba(208,188,255,.2); color:var(--primary);" onclick="openProfileModal()">Edit Profile</button>
            <button class="btn-sm btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="page">


        <div class="grid-main">
            <!-- LEFT: PERSONAL STATS + WEEKLY -->
            <div>
                <div class="sec-label">Your Performance</div>
                <div class="sec-title" id="memberName">—</div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-val" id="statScore">0</div>
                        <div class="stat-lbl">Total Score</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="statStreak">0</div>
                        <div class="stat-lbl">Day Streak 🔥</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-val" id="statRank">#—</div>
                        <div class="stat-lbl">Current Rank</div>
                    </div>

            </div>

            <div>
                <div class="lb-card">
                    <div class="lb-header">
                        <div>
                            <div class="sec-label">Live Leaderboard</div>
                            <div style="font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;">Rankings
                            </div>
                        </div>
                        <button class="lb-refresh" id="refreshBtn" onclick="loadLeaderboard()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M1 4v6h6M23 20v-6h-6" />
                                <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15" />
                            </svg>
                            Refresh
                        </button>
                    </div>
                    <div class="lb-list" id="lbList">
                        <div class="skel-row skeleton"></div>
                        <div class="skel-row skeleton"></div>
                        <div class="skel-row skeleton"></div>
                        <div class="skel-row skeleton"></div>
                        <div class="skel-row skeleton"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- PROFILE MODAL -->
    <div class="modal-overlay" id="profileModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(5px);z-index:1000;display:none;align-items:center;justify-content:center;">
        <div class="modal-card" style="background:rgba(20,27,43,0.95);border:1px solid rgba(208,188,255,0.15);border-radius:16px;padding:2rem;width:90%;max-width:400px;box-shadow:0 20px 40px rgba(0,0,0,0.5);text-align:center;">
            <h3 style="font-family:'Space Grotesk',sans-serif;font-size:1.2rem;margin-bottom:0.5rem;font-weight:700;">Edit Profile</h3>
            <p style="font-size:0.8rem;color:var(--muted);">Select an image from your device.</p>
            <input type="file" id="avatarFileInput" accept="image/*" style="width:100%;background:var(--surface2);border:1px solid var(--outline);border-radius:8px;padding:0.75rem 1rem;color:var(--text);font-size:0.85rem;margin:1rem 0;outline:none;font-family:'Inter';" />
            <div style="display:flex;gap:0.5rem;justify-content:center;">
                <button class="btn-sm btn-logout" onclick="closeProfileModal()" style="padding:.6rem 1.2rem;">Cancel</button>
                <button class="btn-sm" id="saveProfileBtn" style="background:linear-gradient(135deg,var(--primary),var(--primary2));color:#23005c;padding:.6rem 1.2rem;font-weight:700;" onclick="saveProfile()">Save</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="supabase.js"></script>
    <script>
        // ── AUTH CHECK ──────────────────────────────────────────────
        const member = JSON.parse(sessionStorage.getItem('hu_member') || 'null');
        if (!member) { window.location.href = 'index.html'; }

        const TODAY = new Date().toISOString().split('T')[0];

        // ── INIT ────────────────────────────────────────────────────
        document.getElementById('navName').textContent = member.name;
        document.getElementById('statScore').textContent = member.total_score || 0;
        document.getElementById('statStreak').textContent = member.current_streak || 0;

        // ── LOAD EVERYTHING ─────────────────────────────────────────
        async function init() {
            await Promise.all([loadLeaderboard()]);
        }

        // ── PROFILE MODAL ───────────────────────────────────────────
        function openProfileModal() {
            document.getElementById('profileModal').style.display = 'flex';
            document.getElementById('avatarFileInput').value = '';
        }
        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        // Helper to resize image so database doesn't get bloated
        function resizeImage(file, maxWidth, maxHeight) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                        }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        async function saveProfile() {
            const fileInput = document.getElementById('avatarFileInput');
            if (!fileInput.files || !fileInput.files[0]) {
                showToast('Please select an image file.', 'error');
                return;
            }
            
            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true; btn.textContent = 'Saving...';
            
            try {
                // Resize to max 150x150 and compress to base64
                const base64Data = await resizeImage(fileInput.files[0], 150, 150);
                
                const { error } = await db.from('members').update({ avatar_url: base64Data }).eq('id', member.id);
                if (error) throw error;
                
                member.avatar_url = base64Data;
                sessionStorage.setItem('hu_member', JSON.stringify(member));
                showToast('Profile updated!', 'success');
                closeProfileModal();
                loadLeaderboard();
            } catch(e) {
                showToast('Failed to update profile.', 'error');
            } finally {
                btn.disabled = false; btn.textContent = 'Save';
            }
        }

        // ── LEADERBOARD ─────────────────────────────────────────────
        async function loadLeaderboard() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            try {
                const { data, error } = await db
                    .from('members')
                    .select('id,name,total_score,current_streak,avatar_color,avatar_url')
                    .eq('is_active', true)
                    .order('total_score', { ascending: false })
                    .order('current_streak', { ascending: false });

                if (error) throw error;
                renderLeaderboard(data || []);

                // Update my rank
                const myRank = (data || []).findIndex(m => m.id === member.id) + 1;
                document.getElementById('statRank').textContent = myRank > 0 ? `#${myRank}` : '#—';

                // Update my score/streak from fresh data
                const me = (data || []).find(m => m.id === member.id);
                if (me) {
                    document.getElementById('statScore').textContent = me.total_score;
                    document.getElementById('statStreak').textContent = me.current_streak;
                    member.total_score = me.total_score;
                    member.current_streak = me.current_streak;
                    sessionStorage.setItem('hu_member', JSON.stringify(member));
                }
            } catch (e) {
                showToast('Failed to load leaderboard', 'error');
            } finally {
                btn.classList.remove('spinning');
            }
        }

        function renderLeaderboard(members) {
            const list = document.getElementById('lbList');
            if (!members.length) {
                list.innerHTML = '<div class="lb-empty">No members yet. Be the first!</div>';
                return;
            }
            list.innerHTML = members.map((m, i) => {
                const rank = i + 1;
                const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
                const rankIcon = rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : `${rank}`;
                const isMe = m.id === member.id;
                const color = m.avatar_color || '#d0bcff';
                const initial = m.name.charAt(0).toUpperCase();
                const avatarContent = m.avatar_url 
                    ? `<img src="${m.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid ${color}55;" onerror="this.outerHTML='<div class=\\'lb-avatar\\' style=\\'background:${color}22;border-color:${color}55;color:${color}\\'>${initial}</div>'" />`
                    : `<div class="lb-avatar" style="background:${color}22;border-color:${color}55;color:${color}">${initial}</div>`;

                return `
    <div class="lb-item ${isMe ? 'is-me' : ''}" style="background: rgba(25, 31, 47, 0.4); border: 1px solid rgba(255,255,255,0.03); backdrop-filter: blur(8px);">
      <div class="lb-rank ${rankClass}">${rankIcon}</div>
      <div style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${avatarContent}</div>
      <div class="lb-info">
        <div class="lb-name" style="font-size:.9rem;">${m.name}${isMe ? ' <span style="color:var(--primary);font-size:.7rem;">(You)</span>' : ''}</div>
        <div class="lb-streak">🔥 ${m.current_streak} day streak</div>
      </div>
      <div class="lb-score">${m.total_score}</div>
    </div>`;
            }).join('');
        }



        // ── TOAST ────────────────────────────────────────────────────
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ── LOGOUT ──────────────────────────────────────────────────
        function logout() {
            sessionStorage.removeItem('hu_member');
            window.location.href = 'index.html';
        }

        // ── AUTO REFRESH leaderboard every 60s ──────────────────────
        setInterval(loadLeaderboard, 60000);

        init();
    </script>
</body>

</html>
